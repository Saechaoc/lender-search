name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Concurrency key uses github.workflow + github.ref only — both are
# build-system controlled, not user input. Safe by construction; this
# workflow never interpolates untrusted GitHub event fields (issue titles,
# PR bodies, commit messages, etc.) into `run:` blocks.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, RLS pen tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lender_search_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      # Pen tests connect as app_user (NOBYPASSRLS NOSUPERUSER per CONTEXT D-07).
      DATABASE_URL: postgresql://app_user:app_user_password@localhost:5432/lender_search_test
      # globalSetup uses DATABASE_MIGRATION_URL to apply migrations as the postgres
      # superuser (per Plan 06 / Plan 05 — only the owner can ALTER TABLE FORCE).
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/lender_search_test
      # Pen-test JWT signing secret. CI value is fixture-only; production uses
      # Vercel encrypted env (Phase 6).
      RLS_TEST_JWT_SECRET: ci-fixture-jwt-secret-min-16-chars
      # IMPORTANT: SUPABASE_SERVICE_ROLE_KEY is intentionally NOT set here.
      # tests/rls/service-role-boundary.test.ts asserts its absence at runtime
      # (T-01-04 mitigation per Plan 07).

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        # Version comes from `packageManager` in package.json (Corepack convention).
        # Do NOT set `with.version` here — action-setup@v4 rejects duplicate sources
        # with ERR_PNPM_BAD_PM_VERSION.
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision app_user + system_role (replicates scripts/init-db.sh for CI)
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d lender_search_test -v ON_ERROR_STOP=1 <<'SQL'
            -- app_user (NOBYPASSRLS NOSUPERUSER) — used by tests as the tenant-scoped role.
            CREATE ROLE app_user LOGIN PASSWORD 'app_user_password' NOBYPASSRLS NOSUPERUSER;
            GRANT CONNECT ON DATABASE lender_search_test TO app_user;
            GRANT USAGE ON SCHEMA public TO app_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO app_user;
            ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO app_user;

            -- Phase 2 Plan 02-01: system_role for agency-table writes.
            -- Migrations 0002 lines 127/129 reference TO "system_role"; migrate aborts if absent.
            DO $$
            BEGIN
              IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'system_role') THEN
                CREATE ROLE system_role NOLOGIN NOBYPASSRLS NOSUPERUSER;
              END IF;
            END
            $$;
            GRANT system_role TO postgres;
            GRANT CONNECT ON DATABASE lender_search_test TO system_role;
            GRANT USAGE ON SCHEMA public TO system_role;
          SQL

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (excludes intentional ESLint fixture)
        run: pnpm lint

      - name: Lint fixture (proves no-restricted-* rules fire on violations)
        run: pnpm lint:fixture

      - name: Apply migrations + grant DML to app_user (replicates Plan 06 globalSetup)
        env:
          # Migrations run as postgres superuser (only the owner can ALTER FORCE).
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/lender_search_test
          PGPASSWORD: postgres
        run: |
          pnpm drizzle-kit migrate
          psql -h localhost -U postgres -d lender_search_test -v ON_ERROR_STOP=1 \
            -c "GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO app_user;
                GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO app_user;
                -- Phase 3 / Plan 03-01 D-02 maximalist REVOKE: re-apply after the
                -- blanket GRANT so evaluation_event remains UPDATE/DELETE-denied
                -- to app_user + system_role. The 0008 migration REVOKES, but the
                -- ON ALL TABLES IN SCHEMA public GRANT above clobbers it; this
                -- step closes the gap.
                REVOKE UPDATE, DELETE ON evaluation_event FROM app_user;
                REVOKE UPDATE, DELETE ON evaluation_event FROM system_role;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m05 FROM app_user;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m05 FROM system_role;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m06 FROM app_user;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m06 FROM system_role;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m07 FROM app_user;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m07 FROM system_role;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m08 FROM app_user;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m08 FROM system_role;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m09 FROM app_user;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m09 FROM system_role;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m10 FROM app_user;
                REVOKE UPDATE, DELETE ON evaluation_event_y2026m10 FROM system_role;"

      # Phase 3 / Plan 03-01 Task 06 (D-06): seed loader runs after migrate so
      # agency rule rows exist before the schema + RLS suites. The DATABASE_MIGRATION_URL
      # below is a literal localhost connection string (no GitHub event-context
      # interpolation), so this step is safe by construction.
      - name: Run agency seed loader (Phase 3 D-06)
        env:
          DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/lender_search_test
        run: pnpm db:seed

      - name: Verify FORCE ROW LEVEL SECURITY is on (TNT-01 gate)
        env:
          PGPASSWORD: postgres
        run: |
          # Use plain columns + psql's `-A -F'|'` field separator for boolean rendering as `t`/`f`.
          # SQL `||` would cast bool to text as `true`/`false` — breaks the grep below.
          FORCED=$(psql -h localhost -U postgres -d lender_search_test -t -A -F'|' \
            -c "SELECT relname, relforcerowsecurity FROM pg_class WHERE relname IN ('tenant', '_rls_canary') ORDER BY relname")
          echo "$FORCED"
          echo "$FORCED" | grep -q "^_rls_canary|t$" || { echo "ERROR: _rls_canary FORCE RLS not on"; exit 1; }
          echo "$FORCED" | grep -q "^tenant|t$" || { echo "ERROR: tenant FORCE RLS not on"; exit 1; }

      - name: Run schema constraint suite (Phase 2 D-20 + D-10)
        run: pnpm test:schema

      - name: Run RLS pen-test suite (TNT-04 merge gate)
        run: pnpm test:rls
